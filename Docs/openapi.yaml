openapi: 3.1.0
info:
  title: API Garagem de Veículos
  version: 1.0.0
  description: >
    API RESTful desenvolvida em Node.js com Express e TypeScript para gerenciamento
    de catálogo de veículos, lojas, marcas, modelos, opcionais e controle de usuários.
servers:
  - url: http://localhost:3000
    description: Servidor de Desenvolvimento Local

tags:
  - name: Health
    description: Verificação de integridade e status da aplicação
  - name: Usuários
    description: Autenticação, registro e gestão de usuários (Controle de Acesso / RBAC)
  - name: Lojas
    description: Gerenciamento de concessionárias e unidades parceiras
  - name: Marcas
    description: Catálogo de fabricantes de veículos
  - name: Modelos
    description: Catálogo de modelos vinculados às marcas
  - name: Opcionais
    description: Gerenciamento de opcionais e equipamentos dos veículos
  - name: Veículos
    description: Vitrine pública e backoffice administrativo para estoque de veículos

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check da Aplicação
      description: Retorna o status de funcionamento, timestamp atual e tempo de atividade (uptime).
      operationId: getHealth
      responses:
        '200':
          description: Serviço operando normalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: "2026-11-06T18:00:00.000Z"
                uptime: 1234.56

  /api/users/login:
    post:
      tags:
        - Usuários
      summary: Autenticação de Usuário
      description: Realiza a autenticação de credenciais e retorna o token JWT e dados do usuário. Possui Rate Limit de 5 requisições por 15 minutos por IP.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserInput'
            example:
              email: "paula.mendes@garagem.com"
              password: "LoginSeguro123!"
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Erro de validação de schema Zod
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Credenciais inválidas"
        '429':
          description: Limite de tentativas de login excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Muitas tentativas de login neste IP, tente novamente após 15 minutos."

  /api/users/register:
    post:
      tags:
        - Usuários
      summary: Cadastro de Usuário (Admin)
      description: Cria um novo usuário no sistema. Requer autenticação com perfil ADMIN. Possui Rate Limit de 5 cadastros por hora por IP.
      operationId: registerUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
            example:
              name: "Paula Mendes"
              email: "paula.mendes@garagem.com"
              password: "LoginSeguro123!"
              phone: "(37) 97777-6666"
              role: "VENDEDOR"
              commission_rates: 5.5
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Erro de validação Zod (senha fraca, dados ausentes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Não autenticado ou token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso proibido. Permissão restrita a administradores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflito. E-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "E-mail já cadastrado"
        '429':
          description: Limite de registros excedido por IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users:
    get:
      tags:
        - Usuários
      summary: Listagem de Usuários
      description: Lista usuários com suporte a paginação e filtros textuais. Requer perfil ADMIN ou VENDEDOR. Parâmetro include_deleted restrito a ADMIN.
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - $ref: '#/components/parameters/UpdatedAtGteQuery'
        - $ref: '#/components/parameters/UpdatedAtLteQuery'
        - name: name_like
          in: query
          description: Filtro parcial por nome do usuário
          required: false
          schema:
            type: string
        - name: email_like
          in: query
          description: Filtro parcial por e-mail do usuário
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: Filtro exato pelo papel do usuário
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Lista de usuários retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Usuários
      summary: Buscar Usuário por ID
      description: Retorna os dados de um usuário pelo seu UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuário localizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Usuários
      summary: Atualizar Usuário
      description: Atualiza os dados de um usuário existente. Restrito ao perfil ADMIN.
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
            example:
              name: "Paula Mendes Atualizada"
              phone: "(37) 98888-2222"
              role: "ADMIN"
              commission_rates: 7.0
      responses:
        '200':
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Usuários
      summary: Excluir Usuário (Soft Delete)
      description: Realiza a exclusão lógica do usuário. Restrito a ADMIN. Não é permitido que o próprio usuário autenticado exclua a si mesmo.
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuário excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '400':
          description: Requisição inválida (ex. auto-exclusão proibida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Não é possível deletar o próprio usuário."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores:
    get:
      tags:
        - Lojas
      summary: Listar Lojas
      description: Lista lojas com filtros avançados. Requer autenticação (ADMIN ou VENDEDOR).
      operationId: listStores
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - name: name_like
          in: query
          schema:
            type: string
        - name: cnpj
          in: query
          schema:
            type: string
        - name: city_like
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 2
      responses:
        '200':
          description: Lista de lojas retornada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Lojas
      summary: Cadastrar Nova Loja
      description: Cadastra uma nova unidade de loja. Restrito ao perfil ADMIN.
      operationId: createStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreInput'
            example:
              name: "Concessionária Horizonte"
              phone: "(37) 98888-7777"
              cnpj: "12345678000199"
              zip_code: "35500000"
              street: "Av. Paulista"
              number: "1000"
              neighborhood: "Bela Vista"
              city: "São Paulo"
              state: "SP"
              complement: "Sala 101"
      responses:
        '201':
          description: Loja criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: CNPJ já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "CNPJ já cadastrado"

  /api/stores/{id}:
    get:
      tags:
        - Lojas
      summary: Buscar Loja por ID
      description: Retorna dados detalhados da loja pelo UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getStoreById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Loja encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Lojas
      summary: Atualizar Loja
      description: Atualiza os dados de uma loja. Restrito a ADMIN.
      operationId: updateStore
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreBody'
            example:
              phone: "(37) 99999-0000"
              complement: "Bloco B"
      responses:
        '200':
          description: Loja atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CNPJ já em uso por outra loja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Lojas
      summary: Excluir Loja (Soft Delete)
      description: Exclusão lógica de registro da loja. Restrito a ADMIN.
      operationId: deleteStore
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Loja excluída com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/cnpj/{cnpj}:
    get:
      tags:
        - Lojas
      summary: Buscar Loja por CNPJ
      description: Consulta registro de loja pelo CNPJ (14 dígitos). Permitido para ADMIN e VENDEDOR.
      operationId: getStoreByCnpj
      security:
        - BearerAuth: []
      parameters:
        - name: cnpj
          in: path
          required: true
          description: CNPJ numérico ou formatado da loja
          schema:
            type: string
          example: "12345678000199"
      responses:
        '200':
          description: Loja localizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/brands:
    get:
      tags:
        - Marcas
      summary: Listar Marcas
      description: Retorna a lista de marcas de veículos. Permitido para ADMIN e VENDEDOR.
      operationId: listBrands
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - name: name
          in: query
          schema:
            type: string
        - name: name_like
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de marcas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Marcas
      summary: Cadastrar Marca
      description: Cadastra uma nova marca de veículo. Requer autenticação de ADMIN ou VENDEDOR.
      operationId: createBrand
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandInput'
            example:
              name: "Toyota"
      responses:
        '201':
          description: Marca cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/brands/{id}:
    get:
      tags:
        - Marcas
      summary: Buscar Marca por ID
      description: Retorna os dados da marca pelo UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getBrandById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Marca encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Marcas
      summary: Atualizar Marca
      description: Atualiza os dados da marca. Permitido para ADMIN e VENDEDOR.
      operationId: updateBrand
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandBody'
            example:
              name: "Toyota do Brasil"
      responses:
        '200':
          description: Marca atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Marcas
      summary: Excluir Marca (Soft Delete)
      description: Exclusão lógica da marca. Restrito ao perfil ADMIN.
      operationId: deleteBrand
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Marca excluída com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/features:
    get:
      tags:
        - Opcionais
      summary: Listar Opcionais
      description: Retorna a lista de itens/opcionais veiculares (ex. Teto Solar, Bancos de Couro). Permitido para ADMIN e VENDEDOR.
      operationId: listFeatures
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: name
          in: query
          schema:
            type: string
        - name: name_like
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de opcionais retornada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Opcionais
      summary: Cadastrar Opcional
      description: Cadastra um novo item opcional. Permitido para ADMIN e VENDEDOR.
      operationId: createFeature
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureInput'
            example:
              name: "Teto Solar Panorâmico"
      responses:
        '201':
          description: Opcional cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/features/{id}:
    get:
      tags:
        - Opcionais
      summary: Buscar Opcional por ID
      description: Retorna os detalhes de um opcional pelo UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getFeatureById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Opcional encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Opcionais
      summary: Atualizar Opcional
      description: Atualiza o nome de um opcional. Permitido para ADMIN e VENDEDOR.
      operationId: updateFeature
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureBody'
            example:
              name: "Teto Solar Elétrico"
      responses:
        '200':
          description: Opcional atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Opcionais
      summary: Excluir Opcional (Soft Delete)
      description: Exclusão lógica do opcional. Restrito a ADMIN.
      operationId: deleteFeature
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Opcional excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/models:
    get:
      tags:
        - Modelos
      summary: Listar Modelos
      description: Retorna modelos de veículos com filtros por marca, status e busca de nome. Permitido para ADMIN e VENDEDOR.
      operationId: listModels
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          schema:
            type: string
        - name: name_like
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de modelos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Modelos
      summary: Cadastrar Modelo
      description: Cadastra um novo modelo associado a uma marca. Permitido para ADMIN e VENDEDOR.
      operationId: createModel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelInput'
            example:
              brand_id: "c4a7e912-6b94-4d6b-9c2f-0f6a2b8e3a1d"
              name: "Corolla XEi"
