  /api/vehicles:
    get:
      tags:
        - Veículos
      summary: Catálogo Público de Veículos (UC01)
      description: >
        Endpoint público com dados sanitizados (oculta placa completa, custos de aquisição e comissões).
        Suporta paginação fixa (12, 24, 36, 48) e múltiplos filtros de catálogo.
      operationId: findVehiclesPublic
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Quantidade de itens por página (deve ser 12, 24, 36 ou 48)
          schema:
            type: integer
            enum: [12, 24, 36, 48]
            default: 12
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/VehicleCategory'
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: model_id
          in: query
          schema:
            type: string
            format: uuid
        - name: fuel_type
          in: query
          schema:
            $ref: '#/components/schemas/VehicleFuelType'
        - name: transmission
          in: query
          schema:
            $ref: '#/components/schemas/VehicleTransmission'
        - name: min_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: min_year
          in: query
          schema:
            type: integer
            minimum: 1900
        - name: max_year
          in: query
          schema:
            type: integer
            minimum: 1900
        - name: max_mileage
          in: query
          schema:
            type: integer
            minimum: 0
        - name: plate_last_digit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
        - name: feature_ids
          in: query
          description: Lista de UUIDs de opcionais separados por vírgula
          schema:
            type: string
          example: "0a8ef153-bf30-4e3d-83b6-7bdf7d37a718,f5e18231-1552-4467-93be-ef9ce79868f0"
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: search
          in: query
          description: Busca textual global em título e descrição
          schema:
            type: string
