      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Veículo excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{id}/photos:
    post:
      tags:
        - Veículos
      summary: Upload de Fotos do Veículo (UC07, RN006, RN008)
      description: Realiza upload de até 15 fotos para a galeria. Converte para WebP (thumb 400x300 e full 1280x960) com rollback compensatório e limpeza de arquivos temporários. Primeira foto torna-se capa principal (is_primary = true).
      operationId: uploadVehiclePhotos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Imagens nos formatos JPEG, PNG ou WebP (máx 10MB cada, até 15 fotos)
      responses:
        '201':
          description: Fotos enviadas e processadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        vehicle_id:
                          type: string
                          format: uuid
                        thumb_path:
                          type: string
                        full_path:
                          type: string
                        display_order:
                          type: integer
                        is_primary:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{id}/photos/reorder:
    patch:
      tags:
        - Veículos
      summary: Reordenação da Galeria de Fotos (Drag & Drop, RN008)
      description: Atualiza a ordem das fotos do veículo em transação atômica. A foto na posição 0 torna-se capa principal (is_primary = true).
      operationId: reorderVehiclePhotos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photo_ids
              properties:
                photo_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
      responses:
        '200':
          description: Fotos reordenadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{id}/photos/{photoId}:
    delete:
      tags:
        - Veículos
      summary: Exclusão de Foto da Galeria
      description: Remove foto do banco de dados e apaga os arquivos físicos (thumb e full) do disco. Elege nova capa caso a foto excluída fosse a capa.
      operationId: deleteVehiclePhoto
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Foto excluída com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{id}/inspection-report:
    patch:
      tags:
        - Veículos
      summary: Upload de Laudo Pericial Cautelar (PDF)
      description: Anexa ou substitui laudo técnico pericial em formato PDF (máx 20MB). Remove arquivo físico anterior apenas após confirmação no banco.
      operationId: uploadInspectionReport
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - report
              properties:
                report:
                  type: string
                  format: binary
                  description: Arquivo PDF de até 20MB
      responses:
        '200':
          description: Laudo enviado e vinculado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicle:
                    type: object
                  inspection_report_url:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Veículos
      summary: Exclusão de Laudo Pericial
      description: Remove o laudo pericial (PDF) do disco e desvincula do veículo.
      operationId: deleteInspectionReport
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Laudo excluído com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Autenticação via JSON Web Token HS256 (formato `Bearer <token>`). Contém `id`, `email`, `role`, `tenantId` e `storeId`.
    OnboardingSecretAuth:
      type: apiKey
      in: header
      name: x-onboarding-secret
      description: Chave secreta de provisionamento SaaS comparada em tempo constante com `ONBOARDING_SECRET` (exclusivo de `POST /api/tenants/onboard`).

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Identificador único em formato UUID v4
      schema:
        type: string
        format: uuid
      example: "70a6d0b9-5095-46b5-a6a3-a7d0dbba3e5f"

    XTenantIdHeader:
      name: x-tenant-id
      in: header
      required: false
      description: UUID da empresa (tenant) dona da vitrine pública (tem precedência sobre `tenant_id` na query)
      schema:
        type: string
        format: uuid

    XStoreIdHeader:
      name: x-store-id
      in: header
      required: false
      description: UUID da loja (filial) na vitrine pública (tem precedência sobre `store_id` na query)
      schema:
        type: string
        format: uuid

    TenantIdQuery:
      name: tenant_id
      in: query
      required: false
      description: UUID da empresa (tenant) na vitrine pública (ignorado se `x-tenant-id` estiver no header)
      schema:
        type: string
        format: uuid

    StoreIdQuery:
      name: store_id
      in: query
      required: false
      description: UUID da loja (filial) para filtragem (ignorado na vitrine se `x-store-id` estiver no header; ignorado no backoffice se o usuário estiver restrito a uma filial)
      schema:
        type: string
        format: uuid

    PageQuery:
      name: page
      in: query
      required: false
      description: Número da página consultada (mínimo 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de registros retornados (mínimo 1)
      schema:
        type: integer
        minimum: 1
        default: 10

    IsActiveQuery:
      name: is_active
      in: query
      required: false
      description: Filtrar por registros ativos ("true") ou inativos ("false")
      schema:
        type: string
        enum: ["true", "false"]

    IncludeDeletedQuery:
      name: include_deleted
      in: query
      required: false
      description: Incluir registros com soft delete (exclusivo para perfil ADMIN)
      schema:
        type: string
        enum: ["true", "false"]

    CreatedAtGteQuery:
      name: created_at_gte
      in: query
      required: false
      description: Data de criação maior ou igual a (formato ISO YYYY-MM-DD)
      schema:
        type: string
        format: date

    CreatedAtLteQuery:
      name: created_at_lte
      in: query
      required: false
      description: Data de criação menor ou igual a (formato ISO YYYY-MM-DD)
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Não autorizado - Token não fornecido, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Acesso negado. Token não fornecido ou inválido"

    Forbidden:
      description: Acesso proibido - Permissão insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Acesso proibido. Permissão insuficiente."

    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Registro não encontrado"

    ValidationError:
      description: Falha de validação de schema Zod nos parâmetros ou corpo da requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Descrição do erro
      example:
        message: "Registro não encontrado"

    ValidationErrorResponse:
      type: object
      required:
        - status
        - errors
      properties:
        status:
          type: string
          example: "fail"
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Caminho do campo inválido
                example: "body.email"
              message:
                type: string
                description: Detalhes da validação não atendida
                example: "Formato de e-mail inválido"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - uptime
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          example: 452.12

    Tenant:
      type: object
      required:
        - id
        - corporate_name
        - trade_name
        - cnpj
        - is_active
      properties:
        id:
          type: string
          format: uuid
        corporate_name:
          type: string
        trade_name:
          type: string
        cnpj:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    UpdateTenantInput:
      type: object
      properties:
        corporate_name:
          type: string
          minLength: 2
          maxLength: 255
        trade_name:
          type: string
          minLength: 2
          maxLength: 255
        cnpj:
          type: string
          minLength: 14
          maxLength: 18
        is_active:
          type: boolean

    TenantSingleResponse:
      type: object
      required:
        - tenant
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'

    OnboardTenantInput:
      type: object
      required:
        - tenant
        - store
        - admin
      properties:
        tenant:
          type: object
          required:
            - corporate_name
            - trade_name
            - cnpj
          properties:
            corporate_name:
              type: string
              minLength: 2
              maxLength: 255
            trade_name:
              type: string
              minLength: 2
              maxLength: 255
            cnpj:
              type: string
              minLength: 14
              maxLength: 18
            is_active:
              type: boolean
              default: true
        store:
          $ref: '#/components/schemas/CreateStoreInput'
        admin:
          type: object
          required:
            - name
            - email
            - password
            - phone
            - cpf
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 255
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              maxLength: 255
            phone:
              type: string
              minLength: 10
              maxLength: 20
            cpf:
              type: string
            birth_date:
              type: string
              nullable: true

    OnboardTenantResponse:
      type: object
      required:
        - tenant
        - store
        - admin
        - token
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        store:
          $ref: '#/components/schemas/Store'
        admin:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Token JWT inicial emitido para o administrador criado

    UserRole:
      type: string
      enum:
        - ADMIN
        - VENDEDOR
        - VISUALIZADOR
        - PUBLICO

    LoginUserInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: E-mail cadastrado do usuário
        password:
          type: string
          minLength: 1
          description: Senha em texto plano
        tenant_id:
          type: string
          format: uuid
          description: UUID da empresa para desambiguação quando o e-mail existe em múltiplos tenants

    LoginResponse:
      type: object
      required:
        - message
        - userInfo
      properties:
        message:
          type: string
          example: "Login realizado com sucesso!"
        userInfo:
          type: object
          required:
            - token
            - user
          properties:
            token:
              type: string
              description: Token JWT para autenticação
            user:
              $ref: '#/components/schemas/User'

    CreateUserInput:
      type: object
      required:
        - name
        - email
        - password
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Senha com pelo menos 8 dígitos, maiúscula, minúscula, número e caractere especial
        phone:
          type: string
          pattern: '^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$'
          description: Telefone celular no padrão brasileiro
        role:
          $ref: '#/components/schemas/UserRole'
          default: VENDEDOR
        commission_rates:
          type: number
          minimum: 0
          maximum: 100
          description: Taxa de comissão percentual do usuário
        store_id:
          type: string
          format: uuid
          nullable: true
          description: UUID da filial para restringir o usuário (ou null para acesso em toda a empresa)

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        phone:
          type: string
          pattern: '^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$'
        role:
          $ref: '#/components/schemas/UserRole'
        commission_rates:
          type: number
          minimum: 0
          maximum: 100
        store_id:
          type: string
          format: uuid
          nullable: true

    User:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - phone
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
