  /api/vehicles:
    get:
      tags:
        - Veículos
      summary: Catálogo Público de Veículos (UC01)
      description: >
        Endpoint público da vitrine com dados sanitizados (oculta placa completa, custos de aquisição e comissões).
        Exige contexto via `x-tenant-id`/`x-store-id` (Headers) ou `tenant_id`/`store_id` (Query Params),
        com precedência Header > Query, sem fallback. Retorna `404` unificado se a loja for inválida ou de outro tenant.
        Suporta paginação fixa (12, 24, 36, 48) e múltiplos filtros de catálogo.
      operationId: findVehiclesPublic
      parameters:
        - $ref: '#/components/parameters/XTenantIdHeader'
        - $ref: '#/components/parameters/XStoreIdHeader'
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/StoreIdQuery'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Quantidade de itens por página (deve ser 12, 24, 36 ou 48)
          schema:
            type: integer
            enum: [12, 24, 36, 48]
            default: 12
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/VehicleCategory'
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: model_id
          in: query
          schema:
            type: string
            format: uuid
        - name: fuel_type
          in: query
          schema:
            $ref: '#/components/schemas/VehicleFuelType'
        - name: transmission
          in: query
          schema:
            $ref: '#/components/schemas/VehicleTransmission'
        - name: min_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: min_year
          in: query
          schema:
            type: integer
            minimum: 1900
        - name: max_year
          in: query
          schema:
            type: integer
            minimum: 1900
        - name: max_mileage
          in: query
          schema:
            type: integer
            minimum: 0
        - name: plate_last_digit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9
        - name: feature_ids
          in: query
          description: Lista de UUIDs de opcionais separados por vírgula
          schema:
            type: string
          example: "0a8ef153-bf30-4e3d-83b6-7bdf7d37a718,f5e18231-1552-4467-93be-ef9ce79868f0"
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - name: search
          in: query
          description: Busca textual por título (`v.title ILIKE`)
          schema:
            type: string
      responses:
        '200':
          description: Catálogo paginado com dados públicos higienizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCatalogResponse'
        '400':
          description: Contexto ausente/inválido ou falha de validação Zod
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Veículos
      summary: Cadastrar Veículo (UC06)
      description: >
        Cadastra um novo veículo no estoque do tenant autenticado. Restrito a ADMIN e VENDEDOR.
        Usuários vinculados a uma filial (`req.user.storeId !== null`) só podem cadastrar na sua própria filial (`403`).
        Validação condicional:
        - `PROPRIO`: Requer `purchase_price > 0`.
        - `CONSIGNADO`: Requer `owner_name`, `owner_contact`, `owner_price > 0` e `store_commission_rate >= 0`.
      operationId: createVehicle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleInput'
            examples:
              veiculoProprio:
                summary: Exemplo de Veículo Próprio
                value:
                  store_id: "70a6d0b9-5095-46b5-a6a3-a7d0dbba3e5f"
                  model_id: "c4a7e912-6b94-4d6b-9c2f-0f6a2b8e3a1d"
                  sale_type: "PROPRIO"
                  title: "Toyota Corolla XEi 2.0 Flex Automático"
                  description: "Veículo de único dono, revisões em dia na concessionária e pneus novos."
                  sale_price: 110000
                  purchase_price: 90000
                  manufacture_year: 2022
                  model_year: 2023
                  mileage: 25000
                  transmission: "AUTOMATICO"
                  color: "Branco Perolizado"
                  category: "SEDÃ"
                  fuel_type: "FLEX"
                  steering: "Elétrica"
                  doors: 4
                  full_license_plate: "ABC1D23"
                  feature_ids:
                    - "0a8ef153-bf30-4e3d-83b6-7bdf7d37a718"
                    - "f5e18231-1552-4467-93be-ef9ce79868f0"
              veiculoConsignado:
                summary: Exemplo de Veículo Consignado
                value:
                  store_id: "70a6d0b9-5095-46b5-a6a3-a7d0dbba3e5f"
                  model_id: "c4a7e912-6b94-4d6b-9c2f-0f6a2b8e3a1d"
                  sale_type: "CONSIGNADO"
                  title: "Honda Civic Touring 1.5 Turbo"
                  description: "Consignado de cliente particular, impecável e laudo cautelar aprovado."
                  sale_price: 125000
                  owner_name: "Roberto Alencar"
                  owner_contact: "(37) 98888-5555"
                  owner_price: 118000
                  store_commission_rate: 5.0
                  manufacture_year: 2021
                  model_year: 2022
                  mileage: 38000
                  transmission: "AUTOMATICO"
                  color: "Preto"
                  category: "SEDÃ"
                  fuel_type: "GASOLINA"
                  steering: "Elétrica"
                  doors: 4
                  full_license_plate: "XYZ9876"
      responses:
        '201':
          description: Veículo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Loja, modelo ou opcional não encontrado no tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Placa já cadastrada para outro veículo ativo no tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Placa já cadastrada para outro veículo ativo"

