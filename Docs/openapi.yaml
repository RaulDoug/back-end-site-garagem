      operationId: reorderVehiclePhotos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photo_ids
              properties:
                photo_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
