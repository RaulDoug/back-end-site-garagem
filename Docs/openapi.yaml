          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Autenticação via JSON Web Token (formato `Bearer <token>`).

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Identificador único em formato UUID v4
      schema:
        type: string
        format: uuid
      example: "70a6d0b9-5095-46b5-a6a3-a7d0dbba3e5f"

    PageQuery:
      name: page
      in: query
      required: false
      description: Número da página consultada (mínimo 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de registros retornados (mínimo 1)
      schema:
        type: integer
        minimum: 1
        default: 10

    IsActiveQuery:
      name: is_active
      in: query
      required: false
      description: Filtrar por registros ativos ("true") ou inativos ("false")
      schema:
        type: string
        enum: ["true", "false"]

    IncludeDeletedQuery:
      name: include_deleted
      in: query
      required: false
      description: Incluir registros com soft delete (exclusivo para perfil ADMIN)
      schema:
        type: string
        enum: ["true", "false"]

    CreatedAtGteQuery:
      name: created_at_gte
      in: query
      required: false
      description: Data de criação maior ou igual a (formato ISO YYYY-MM-DD)
      schema:
        type: string
        format: date

    CreatedAtLteQuery:
      name: created_at_lte
      in: query
      required: false
      description: Data de criação menor ou igual a (formato ISO YYYY-MM-DD)
      schema:
        type: string
        format: date

    UpdatedAtGteQuery:
      name: updated_at_gte
      in: query
      required: false
      description: Data de atualização maior ou igual a (formato ISO YYYY-MM-DD)
      schema:
        type: string
        format: date

    UpdatedAtLteQuery:
      name: updated_at_lte
      in: query
      required: false
      description: Data de atualização menor ou igual a (formato ISO YYYY-MM-DD)
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Não autorizado - Token não fornecido, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Acesso negado. Token não fornecido ou inválido"

    Forbidden:
      description: Acesso proibido - Permissão insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Acesso proibido. Permissão insuficiente."

    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Registro não encontrado"

    ValidationError:
      description: Falha de validação de schema Zod nos parâmetros ou corpo da requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Descrição do erro
      example:
        message: "Registro não encontrado"

    ValidationErrorResponse:
      type: object
      required:
        - status
        - errors
      properties:
        status:
          type: string
          example: "fail"
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Caminho do campo inválido
                example: "body.email"
              message:
                type: string
                description: Detalhes da validação não atendida
                example: "Formato de e-mail inválido"

    HealthResponse:
      type: object
      required:
