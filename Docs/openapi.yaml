openapi: 3.1.0
info:
  title: API Garagem de Veículos
  version: 1.0.0
  description: >
    API RESTful multi-tenant e multi-store desenvolvida em Node.js com Express 5 e TypeScript
    para gerenciamento de empresas (tenants), lojas (filiais), catálogo de veículos,
    marcas, modelos, opcionais, mídias otimizadas e controle de acesso (RBAC).
servers:
  - url: http://localhost:3000
    description: Servidor de Desenvolvimento Local

tags:
  - name: Health
    description: Verificação de integridade e status da aplicação
  - name: Tenants
    description: Provisionamento SaaS (onboarding transacional) e dados da empresa autenticada
  - name: Usuários
    description: Autenticação JWT, registro e gestão de usuários por empresa e filial (RBAC)
  - name: Lojas
    description: Gerenciamento de concessionárias/filiais do tenant e consulta pública da vitrine
  - name: Marcas
    description: Catálogo híbrido de fabricantes de veículos (globais e customizados do tenant)
  - name: Modelos
    description: Catálogo de modelos isolado por tenant e vinculado às marcas visíveis
  - name: Opcionais
    description: Catálogo híbrido de opcionais veiculares (globais e customizados do tenant)
  - name: Veículos
    description: Vitrine pública (com contexto de tenant/loja) e backoffice administrativo para estoque e mídias

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check da Aplicação
      description: Retorna o status de funcionamento, timestamp atual e tempo de atividade (uptime).
      operationId: getHealth
      responses:
        '200':
          description: Serviço operando normalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                timestamp: "2026-11-06T18:00:00.000Z"
                uptime: 1234.56

  /api/tenants/onboard:
    post:
      tags:
        - Tenants
      summary: Onboarding Transacional de Nova Empresa (Tenant + Matriz + Admin)
      description: >
        Cria em uma única transação ACID a empresa (`tenant`), a loja matriz (`store`) e o primeiro
        administrador (`admin`), retornando o token JWT inicial. Protegida por `registerLimit` (5 req/hora por IP)
        e pela chave de provisionamento enviada no header `x-onboarding-secret`.
      operationId: onboardTenant
      security:
        - OnboardingSecretAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardTenantInput'
      responses:
        '201':
          description: Empresa, matriz e administrador criados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardTenantResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Chave de provisionamento `x-onboarding-secret` ausente ou inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Acesso negado. Chave de provisionamento inválida ou ausente."
        '409':
          description: CNPJ da empresa, CNPJ da loja ou e-mail já em uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "CNPJ da empresa já está em uso"
        '429':
          description: Limite de provisionamentos por IP excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tenants/me:
    get:
      tags:
        - Tenants
      summary: Consultar Dados da Própria Empresa
      description: Retorna os dados cadastrais do tenant associado ao token JWT (`req.user.tenantId`).
      operationId: getMyTenant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados do tenant retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Tenants
      summary: Atualizar Dados da Própria Empresa
      description: Atualiza os dados cadastrais do tenant do usuário autenticado. Restrito ao perfil ADMIN.
      operationId: updateMyTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantInput'
            example:
              trade_name: "Alpha Motors Premium"
      responses:
        '200':
          description: Dados do tenant atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CNPJ da empresa já está em uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/login:
    post:
      tags:
        - Usuários
      summary: Autenticação de Usuário
      description: >
        Realiza a autenticação de credenciais e retorna o token JWT (HS256, 1d) com `tenantId` e `storeId`.
        Possui Rate Limit de 5 tentativas falhas por 15 minutos por IP (`skipSuccessfulRequests: true`).
        Caso o mesmo e-mail exista ativo em múltiplos tenants, informe `tenant_id` para desambiguação.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserInput'
            example:
              email: "paula.mendes@garagem.com"
              password: "LoginSeguro123!"
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Erro de validação de schema Zod ou e-mail vinculado a múltiplos tenants sem informar `tenant_id`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Credenciais inválidas"
        '429':
          description: Limite de tentativas falhas de login excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Muitas tentativas de login neste IP, tente novamente após 15 minutos."

  /api/users/register:
    post:
      tags:
        - Usuários
      summary: Cadastro de Usuário (Admin)
      description: Cria um novo usuário no tenant do administrador autenticado, com vínculo opcional a uma filial (`store_id`). Requer perfil ADMIN. Possui Rate Limit de 5 cadastros por hora por IP.
      operationId: registerUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
            example:
              name: "Paula Mendes"
              email: "paula.mendes@garagem.com"
              password: "LoginSeguro123!"
              phone: "(37) 97777-6666"
              role: "VENDEDOR"
              commission_rates: 5.5
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Erro de validação Zod (senha fraca, dados ausentes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Não autenticado ou token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso proibido. Permissão restrita a administradores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Filial (`store_id`) informada não encontrada na empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Filial informada não encontrada nesta empresa"
        '409':
          description: Conflito. E-mail já cadastrado no tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "E-mail já cadastrado"
        '429':
          description: Limite de registros excedido por IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users:
    get:
      tags:
        - Usuários
      summary: Listagem de Usuários
      description: Lista usuários do tenant autenticado com paginação e filtros textuais. Requer perfil ADMIN ou VENDEDOR. Parâmetro include_deleted restrito a ADMIN.
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - name: name_like
          in: query
          description: Filtro parcial por nome do usuário
          required: false
          schema:
            type: string
        - name: email_like
          in: query
          description: Filtro parcial por e-mail do usuário
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: Filtro exato pelo papel do usuário
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Lista de usuários retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Usuários
      summary: Buscar Usuário por ID
      description: Retorna os dados de um usuário do mesmo tenant pelo UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuário localizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Usuários
      summary: Atualizar Usuário
      description: Atualiza os dados de um usuário do mesmo tenant. Restrito ao perfil ADMIN.
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
            example:
              name: "Paula Mendes Atualizada"
              phone: "(37) 98888-2222"
              role: "ADMIN"
              commission_rates: 7.0
      responses:
        '200':
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: E-mail já em uso por outro usuário no tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Usuários
      summary: Excluir Usuário (Soft Delete)
      description: Realiza a exclusão lógica do usuário no mesmo tenant. Restrito a ADMIN. Não é permitido excluir a si mesmo.
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Usuário excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '400':
          description: Requisição inválida (ex. auto-exclusão proibida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Não é possível deletar o próprio usuário."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/public/{id}:
    get:
      tags:
        - Lojas
      summary: Consulta Pública da Loja (Vitrine)
      description: >
        Retorna os dados da loja para exibição na vitrine pública sem autenticação JWT.
        Valida simultaneamente que a loja e seu tenant estão ativos e não deletados.
      operationId: getPublicStoreById
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Loja pública localizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores:
    get:
      tags:
        - Lojas
      summary: Listar Lojas
      description: Lista lojas do tenant autenticado com filtros avançados. Requer autenticação (ADMIN ou VENDEDOR). Parâmetro include_deleted restrito a ADMIN.
      operationId: listStores
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - name: name_like
          in: query
          schema:
            type: string
        - name: cnpj
          in: query
          schema:
            type: string
        - name: city_like
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 2
      responses:
        '200':
          description: Lista de lojas retornada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Lojas
      summary: Cadastrar Nova Loja
      description: Cadastra uma nova unidade de loja no tenant do usuário autenticado. Restrito ao perfil ADMIN.
      operationId: createStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreInput'
            example:
              name: "Concessionária Horizonte"
              phone: "(37) 98888-7777"
              cnpj: "12345678000199"
              zip_code: "35500000"
              street: "Av. Paulista"
              number: "1000"
              neighborhood: "Bela Vista"
              city: "São Paulo"
              state: "SP"
              complement: "Sala 101"
      responses:
        '201':
          description: Loja criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: CNPJ já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "CNPJ já cadastrado"

  /api/stores/{id}:
    get:
      tags:
        - Lojas
      summary: Buscar Loja por ID
      description: Retorna dados detalhados de uma loja do mesmo tenant pelo UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getStoreById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Loja encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Lojas
      summary: Atualizar Loja
      description: Atualiza os dados de uma loja do mesmo tenant. Restrito a ADMIN.
      operationId: updateStore
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreBody'
            example:
              phone: "(37) 99999-0000"
              complement: "Bloco B"
      responses:
        '200':
          description: Loja atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CNPJ já em uso por outra loja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Lojas
      summary: Excluir Loja (Soft Delete)
      description: Exclusão lógica de registro da loja no mesmo tenant. Restrito a ADMIN.
      operationId: deleteStore
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Loja excluída com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/cnpj/{cnpj}:
    get:
      tags:
        - Lojas
      summary: Buscar Loja por CNPJ
      description: Consulta registro de loja do mesmo tenant pelo CNPJ (14 dígitos). Permitido para ADMIN e VENDEDOR.
      operationId: getStoreByCnpj
      security:
        - BearerAuth: []
      parameters:
        - name: cnpj
          in: path
          required: true
          description: CNPJ numérico ou formatado da loja
          schema:
            type: string
          example: "12345678000199"
      responses:
        '200':
          description: Loja localizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/brands:
    get:
      tags:
        - Marcas
      summary: Listar Marcas (Catálogo Híbrido)
      description: Retorna marcas globais (`tenant_id = null`) e marcas customizadas do tenant autenticado. Permitido para ADMIN e VENDEDOR.
      operationId: listBrands
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/IsActiveQuery'
        - $ref: '#/components/parameters/IncludeDeletedQuery'
        - $ref: '#/components/parameters/CreatedAtGteQuery'
        - $ref: '#/components/parameters/CreatedAtLteQuery'
        - name: name
          in: query
          schema:
            type: string
        - name: name_like
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de marcas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Marcas
      summary: Cadastrar Marca
      description: Cadastra uma nova marca exclusiva do tenant autenticado. Requer autenticação de ADMIN ou VENDEDOR.
      operationId: createBrand
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandInput'
            example:
              name: "Toyota"
      responses:
        '201':
          description: Marca cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Marca já cadastrada no catálogo global ou no tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/brands/{id}:
    get:
      tags:
        - Marcas
      summary: Buscar Marca por ID
      description: Retorna os dados de uma marca global ou do próprio tenant pelo UUID. Permitido para ADMIN e VENDEDOR.
      operationId: getBrandById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Marca encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Marcas
      summary: Atualizar Marca
      description: Atualiza os dados de uma marca do próprio tenant. Marcas globais retornam 403. Permitido para ADMIN e VENDEDOR.
      operationId: updateBrand
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandBody'
            example:
              name: "Toyota do Brasil"
      responses:
        '200':
          description: Marca atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nome de marca já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Marcas
      summary: Excluir Marca (Soft Delete)
      description: Exclusão lógica de marca exclusiva do tenant. Marcas globais retornam 403. Restrito ao perfil ADMIN.
      operationId: deleteBrand
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
