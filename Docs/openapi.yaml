      type: string
      enum:
        - GASOLINA
        - ALCOOL
        - DIESEL
        - FLEX
        - ELETRICO
        - HIBRIDO

    VehicleStatus:
      type: string
      enum:
        - ATIVO
        - RESERVADO
        - EM_NEGOCIACAO
        - VENDIDO
        - INATIVO

    CreateVehicleInput:
      type: object
      required:
        - store_id
        - model_id
        - title
        - description
        - sale_price
        - manufacture_year
        - model_year
        - mileage
        - transmission
        - color
        - category
        - fuel_type
        - steering
        - doors
        - full_license_plate
      properties:
        store_id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        promotion_id:
          type: string
          format: uuid
          nullable: true
        sale_type:
          $ref: '#/components/schemas/VehicleSaleType'
          default: PROPRIO
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 5
        sale_price:
          type: number
          exclusiveMinimum: 0
        purchase_price:
          type: number
          nullable: true
          description: Preço de compra pago pela loja (obrigatório e > 0 se sale_type for PROPRIO)
        owner_name:
          type: string
          nullable: true
          description: Nome do proprietário (obrigatório se sale_type for CONSIGNADO)
        owner_contact:
          type: string
          nullable: true
          description: Telefone de contato do proprietário (obrigatório se sale_type for CONSIGNADO)
        owner_price:
          type: number
          nullable: true
          description: Valor a repassar ao proprietário (obrigatório se sale_type for CONSIGNADO)
        store_commission_rate:
          type: number
          nullable: true
          description: Taxa de comissão retida pela loja (obrigatório e >= 0 se sale_type for CONSIGNADO)
        fipe_price:
          type: number
          nullable: true
        min_down_payment:
          type: number
          nullable: true
        max_installments:
          type: integer
          nullable: true
        manufacture_year:
          type: integer
          minimum: 1900
        model_year:
          type: integer
          minimum: 1900
        mileage:
          type: integer
          minimum: 0
        transmission:
          $ref: '#/components/schemas/VehicleTransmission'
        color:
          type: string
          minLength: 2
          maxLength: 20
        category:
          $ref: '#/components/schemas/VehicleCategory'
        horsepower:
          type: integer
          nullable: true
        fuel_type:
          $ref: '#/components/schemas/VehicleFuelType'
        steering:
          type: string
          minLength: 2
          maxLength: 20
        doors:
          type: integer
          minimum: 1
          maximum: 10
        full_license_plate:
          type: string
          description: Placa no formato Mercosul (ex. ABC1D23) ou padrão antigo (ex. ABC1234)
        status:
          $ref: '#/components/schemas/VehicleStatus'
          default: ATIVO
        video_url:
          type: string
          maxLength: 255
          nullable: true
        inspection_report_url:
          type: string
          maxLength: 255
          nullable: true
        feature_ids:
          type: array
          items:
            type: string
            format: uuid

