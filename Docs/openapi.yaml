          description: Catálogo paginado com dados públicos higienizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCatalogResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    post:
      tags:
        - Veículos
      summary: Cadastrar Veículo (UC06)
      description: >
        Cadastra um novo veículo no estoque. Restrito a ADMIN e VENDEDOR.
        Validação condicional:
        - `PROPRIO`: Requer `purchase_price > 0`.
        - `CONSIGNADO`: Requer `owner_name`, `owner_contact`, `owner_price > 0` e `store_commission_rate >= 0`.
      operationId: createVehicle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleInput'
            examples:
              veiculoProprio:
                summary: Exemplo de Veículo Próprio
                value:
                  store_id: "70a6d0b9-5095-46b5-a6a3-a7d0dbba3e5f"
                  model_id: "c4a7e912-6b94-4d6b-9c2f-0f6a2b8e3a1d"
                  sale_type: "PROPRIO"
                  title: "Toyota Corolla XEi 2.0 Flex Automático"
                  description: "Veículo de único dono, revisões em dia na concessionária e pneus novos."
                  sale_price: 110000
                  purchase_price: 90000
                  manufacture_year: 2022
                  model_year: 2023
                  mileage: 25000
                  transmission: "AUTOMATICO"
                  color: "Branco Perolizado"
                  category: "SEDÃ"
                  fuel_type: "FLEX"
                  steering: "Elétrica"
                  doors: 4
                  full_license_plate: "ABC1D23"
                  feature_ids:
                    - "0a8ef153-bf30-4e3d-83b6-7bdf7d37a718"
                    - "f5e18231-1552-4467-93be-ef9ce79868f0"
              veiculoConsignado:
                summary: Exemplo de Veículo Consignado
                value:
                  store_id: "70a6d0b9-5095-46b5-a6a3-a7d0dbba3e5f"
                  model_id: "c4a7e912-6b94-4d6b-9c2f-0f6a2b8e3a1d"
                  sale_type: "CONSIGNADO"
                  title: "Honda Civic Touring 1.5 Turbo"
                  description: "Consignado de cliente particular, impecável e laudo cautelar aprovado."
                  sale_price: 125000
                  owner_name: "Roberto Alencar"
                  owner_contact: "(37) 98888-5555"
                  owner_price: 118000
                  store_commission_rate: 5.0
                  manufacture_year: 2021
                  model_year: 2022
                  mileage: 38000
                  transmission: "AUTOMATICO"
                  color: "Preto"
                  category: "SEDÃ"
                  fuel_type: "GASOLINA"
                  steering: "Elétrica"
                  doors: 4
                  full_license_plate: "XYZ9876"
      responses:
        '201':
          description: Veículo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSingleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Placa já cadastrada para outro veículo ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Placa já cadastrada para outro veículo ativo"

