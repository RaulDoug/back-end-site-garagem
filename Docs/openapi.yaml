  /api/vehicles/{id}/photos:
    post:
      tags:
        - Veículos
      summary: Upload de Fotos do Veículo (UC07, RN006, RN008)
      description: Realiza upload de até 15 fotos para a galeria. Converte para WebP (thumb 400x300 e full 1280x960). Primeira foto torna-se capa principal (is_primary = true).
      operationId: uploadVehiclePhotos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Imagens nos formatos JPEG, PNG ou WebP (máx 10MB cada, até 15 fotos)
      responses:
        '201':
          description: Fotos enviadas e processadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        vehicle_id:
                          type: string
                          format: uuid
                        thumb_path:
                          type: string
                        full_path:
                          type: string
                        display_order:
                          type: integer
                        is_primary:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
